[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophi"
version = "0.1.0"
description = "CDCP preauthorization copilot — documentation gap-check and packet assembly. Human submits."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dateutil>=2.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "reportlab>=4",
  "python-docx>=1.1",
  "pillow>=10",
  "unidecode>=1.3",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "playwright>=1.40"]

[project.scripts]
ophi = "ophi.cli:main"

[tool.setuptools.packages.find]
include = ["ophi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
