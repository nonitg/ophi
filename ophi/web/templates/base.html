<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Ophi{% endblock %}</title>
<link rel="preload" href="{{ BASE }}/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ BASE }}/static/app.css?v={{ STATIC_V }}">
</head>
<body>
{% set path = here %}
<div class="demo"><span>Demo with fictional patients. Today is fixed at {{ full_date(today) }}.</span>
  <form method="post" action="{{ BASE }}/reset" data-confirm="Start the demo over? Every answer, signature, decision and test run is cleared."><button class="linkish" type="submit">Start over</button></form></div>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="{{ HOME }}" aria-label="Ophi board">{% include "wordmark.svg" %}</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ HOME }}" {% if path == '/' or path.startswith('/cases') %}aria-current="page"{% endif %}>Board</a>
      <a href="{{ BASE }}/recover" {% if path.startswith('/recover') %}aria-current="page"{% endif %}>Past denials</a>
      <a href="{{ BASE }}/results" {% if path.startswith('/results') %}aria-current="page"{% endif %}>Results</a>
      <a href="{{ BASE }}/model" class="nav-laya" {% if path.startswith('/model') %}aria-current="page"{% endif %}><svg class="laya-spark" width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .5c.6 3.9 3.2 6.6 7.5 7.5-4.3.9-6.9 3.6-7.5 7.5C7.4 11.6 4.8 8.9.5 8 4.8 7.1 7.4 4.4 8 .5z"/></svg>Laya</a>
      <a href="{{ BASE }}/settings" {% if path.startswith('/settings') or path == '/outcomes' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <form class="me" method="post" action="{{ BASE }}/actor" aria-label="View as">
      <span class="me-k">View as</span>
      {% for key, a in ACTORS.items() %}
      <button type="submit" name="actor" value="{{ key }}" aria-pressed="{{ 'true' if a.key == actor.key else 'false' }}"><span class="mono-mark" aria-hidden="true">{{ initials(a.name) }}</span>{{ a.name }}</button>
      {% endfor %}
    </form>
  </div>
</header>
<main class="page" id="main">
{% if done %}<p class="done-note" role="status">{{ done }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
<script src="{{ BASE }}/static/app.js?v={{ STATIC_V }}"></script>
</body>
</html>
