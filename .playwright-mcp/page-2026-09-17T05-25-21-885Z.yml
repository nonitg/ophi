  - main [ref=f15e22]:
    - generic [ref=f15e25]:
      - heading "Important Update on Preauthorization" [level=1] [ref=f15e28]
      - generic [ref=f15e30]:
        - paragraph [ref=f15e31]: Since November 1, 2024, providers have been able to submit Canadian Dental Care Plan (CDCP) preauthorization requests for services that require prior approval. The preauthorization process is not to determine if the provider’s proposed treatment is the right treatment — that decision is between the provider and their patient. Instead, this process confirms if the proposed treatment or service meets the CDCP coverage criteria and will be covered by the plan.
        - paragraph [ref=f15e32]: The CDCP preauthorization process is different from private insurance plans, and an adjustment period is expected.
        - paragraph [ref=f15e33]: Health Canada and Sun Life are aware of challenges providers have faced over the last month. We are actively working to simplify the process, where possible, and provide more clarity about the details and documentation required as part of the submission. Some improvements are already in place, while others will take a bit more time to implement.
        - heading "Missing documentation and EDI attachments" [level=2] [ref=f15e34]:
          - text: Missing documentation and EDI attachments
          - strong
        - paragraph [ref=f15e35]: We appreciate the large number of preauthorization requests being submitted through the Electronic Data Interchange (EDI). However, most requests are being sent without the necessary attachments or missing documentation. This seems to be caused by a variety of issues, from an awareness gap to technical issues.
        - paragraph [ref=f15e36]: We encourage providers to verify if their practice management software (PMS) fully supports the submission of attachments and note sections through EDI. Your PMS vendor should be able to assist you and provide training to you and your staff, if needed.
        - paragraph [ref=f15e37]:
          - strong [ref=f15e38]: "Important note:"
          - text: If your PMS does not support the submission of attachments through EDI, please submit your preauthorization requests and all supporting documentation by mail only – See
          - link "How to submit CDCP claims and preauthorization requests during a postal disruption" [ref=f15e39] [cursor=pointer]:
            - /url: /sl/cdcp/en/support/oral-health-provider-faq/#postal-strike
          - text: .
        - heading "Resubmitting requests due to missing documentation" [level=2] [ref=f15e40]:
          - text: Resubmitting requests due to missing documentation
          - strong
        - paragraph [ref=f15e41]:
          - text: If your preauthorization request(s) was denied because some or all documentation required was missing, you will need to
          - strong [ref=f15e42]: resubmit it to Sun Life
          - text: with the required documentation. This will not be considered a reconsideration request.
        - paragraph [ref=f15e43]: Make sure to include all required documentation, including treatment plan details and information about how your patient’s basic needs have been or will be addressed (e.g. control of periodontal disease and decay). Clinical notes can help provide important details not included in the claim form and/or any related x-rays or photographs submitted.
        - paragraph [ref=f15e44]: We acknowledge that this adds an extra additional administrative step for you and your staff, but it is currently the most effective way for your request to be assessed.
        - heading "Not all requests will be approved" [level=2] [ref=f15e45]
        - paragraph [ref=f15e46]:
          - text: The CDCP is a publicly funded program aimed at improving public health outcomes while managing public funds responsibly. Its coverage criteria may be more stringent in terms of what is approved through preauthorization, compared to other plans, and
          - strong [ref=f15e47]: not all requests will be approved
          - text: .
        - paragraph [ref=f15e48]: Health Canada and Sun Life are committed to working with oral health provider associations and providers alike to ensure the CDCP is successfully implemented. We appreciate the feedback we have received and thank you for your collaboration and patience.
