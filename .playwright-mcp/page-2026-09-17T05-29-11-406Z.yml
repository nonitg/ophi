    - article [ref=f494e42]:
      - heading "Canadian Dental Care Plan Oral Health Provider Newsletter Volume 1 – May 29, 2025" [level=1] [ref=f494e43]
      - paragraph [ref=f494e45]: This message was created jointly with the Government of Canada.
      - generic [ref=f494e49]:
        - generic [ref=f494e51]:
          - 'heading "Canadian Dental Care Plan: Oral Health Provider News" [level=2] [ref=f494e52]'
          - paragraph [ref=f494e53]: This is your quarterly oral health provider update to help keep you and your staff informed of the latest Canadian Dental Care Plan (CDCP) news.
          - paragraph [ref=f494e54]: "CDCP Statistics at a glance:"
          - list [ref=f494e55]:
            - listitem [ref=f494e56]: Close to 1.9 million Canadians have received services to date
            - listitem [ref=f494e57]: Over 25K eligible oral health-providers are participating in the CDCP to date
            - listitem [ref=f494e58]: More than 3.6 million Canadians have been deemed eligible for CDCP services to date
          - paragraph [ref=f494e59]:
            - text: CDCP statistics are updated on a monthly basis and are found on
            - link "the Government of Canada CDCP statistics webpage opens in a new tab" [ref=f494e60] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/statistics.html
              - text: the Government of Canada CDCP statistics webpage
              - img "opens in a new tab" [ref=f494e62]
            - text: .
          - heading "Preauthorization processing information" [level=2] [ref=f494e64]
          - paragraph [ref=f494e65]: Sun Life is currently processing a high volume of preauthorization submissions. The turnaround times for preauthorization requests vary based on the volume and complexity of submissions received. We acknowledge that the turnaround times are longer than expected and both Sun Life and Health Canada are continuing to work together to reduce these timelines and improve the process, where possible.
          - paragraph [ref=f494e66]: To minimize delays, providers are reminded to avoid submitting the same requests for preauthorization or claims multiple times as this creates additional backlogs and delays in adjudication. Providers will only receive a decision once their submission/claim has been processed. Claims and submissions are being processed on a first-in, first-out basis.
          - paragraph [ref=f494e67]:
            - strong [ref=f494e68]: "Note:"
            - text: Preauthorization submissions that are submitted again as a result of their Explanation of Benefits indicating the submission was declined due to missing documentation are also going to be processed on a first-in, first-out basis, as they are considered a new submission. Please ensure to review all required documentation before submitting your request to avoid further delays.
          - paragraph [ref=f494e69]: Once the preauthorization is adjudicated, decisions will be sent to your Sun Life Direct account or if you do not have a Sun Life Direct account, by mail. Claims for preauthorized services will be paid according to the CDCP fee grid rates and the co-payment level on the date of service.
          - paragraph [ref=f494e70]: Providers and their staff should call the Sun Life Contact Centre at 1-888-888-8110 for any questions related to preauthorization and/or claims submissions, agents are there to help answer your questions.
          - heading "Preauthorization resources" [level=2] [ref=f494e71]
          - paragraph [ref=f494e72]:
            - text: The Government of Canada's CDCP website offers valuable resources to assist with the preauthorization process. These
            - link "Preauthorization resources opens in a new tab" [ref=f494e73] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/providers/preauthorization.html
              - text: Preauthorization resources
              - img "opens in a new tab" [ref=f494e75]
            - text: "include:"
          - list [ref=f494e77]:
            - listitem [ref=f494e78]:
              - 'link "Table: Supporting documentation requirements for preauthorization submissions opens in a new tab" [ref=f494e79] [cursor=pointer]':
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/providers/preauthorization.html
                - text: "Table: Supporting documentation requirements for preauthorization submissions"
                - img "opens in a new tab" [ref=f494e81]
              - insertion
            - listitem [ref=f494e83]:
              - link "Tutorial video on Preauthorization for Partial Dentures opens in a new tab" [ref=f494e84] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/providers/preauthorization/partial-dentures-video.html
                - text: Tutorial video on Preauthorization for Partial Dentures
                - img "opens in a new tab" [ref=f494e86]
            - listitem [ref=f494e88]:
              - link "Tutorial video on Preauthorization for Additional Units of Scaling opens in a new tab" [ref=f494e89] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/providers/preauthorization/scaling-video.html
                - text: Tutorial video on Preauthorization for Additional Units of Scaling
                - img "opens in a new tab" [ref=f494e91]
          - heading "Annual member renewal has started" [level=2] [ref=f494e93]
          - paragraph [ref=f494e95]:
            - text: Eligibility for the CDCP is reassessed annually
            - strong [ref=f494e96]
            - text: and
            - strong [ref=f494e97]: existing CDCP clients must renew their coverage under the CDCP before June 1, 2025,
            - text: to avoid a potential gap in coverage. All existing CDCP clients have received a letter from the Government of Canada informing them that they need to submit a renewal application
            - strong [ref=f494e98]: prior to June 1, 2025
            - text: ","
            - strong [ref=f494e99]
            - text: to avoid a potential gap in coverage, and how they can renew.
          - paragraph [ref=f494e100]:
            - strong [ref=f494e101]: It is important that oral health providers always validate a CDCP client’s coverage and co-payment level before providing services or treatments for each visit.
          - list [ref=f494e102]:
            - listitem [ref=f494e103]:
              - text: When a CDCP client completes the renewal process, they will receive a confirmation letter from the Government of Canada outlining their eligibility for the next benefit period including any changes to their co-payment level (if applicable).
              - list [ref=f494e104]:
                - listitem [ref=f494e105]:
                  - strong [ref=f494e106]: Note
                  - text: ": some CDCP clients who renewed their coverage for the 2025-2026 benefit coverage period with no changes to their co-payment level may have received a confirmation letter from the Government of Canada with their initial benefit effective date from 2024-25, as opposed to June 1, 2025. These clients remain covered for the 2025-2026 benefit coverage period – from June 1, 2025, to June 30, 2026 - with no changes to their co-payment level."
            - listitem [ref=f494e107]:
              - strong [ref=f494e108]: Clients who do not renew or become ineligible for the next benefit period will have their coverage end on June 30, 2025
              - text: ", and will receive an end date notification letter from the Government of Canada."
            - listitem [ref=f494e109]: Services are only covered by the plan if your CDCP patient is eligible on the date the service is completed. This also means that any estimates or preauthorization submissions previously approved will not be valid if your patient is no longer covered under the plan and the care is received after June 30, 2025.
            - listitem [ref=f494e110]:
              - text: CDCP clients can renew after the June 1, 2025, deadline, but may experience a gap in coverage. Their coverage can be reinstated if they still meet the eligibility criteria; however,
              - strong [ref=f494e111]: any treatment received during a gap in coverage will not be covered nor reimbursed retroactively
              - text: .
              - strong
            - listitem [ref=f494e112]: CDCP clients who continue to be covered under the plan will keep the same CDCP member ID and member card. Providers can confirm coverage through Electronic Data Interchange (EDI) estimates, calling Sun Life's dedicated CDCP Contact Centre, or using the CDCP coverage look-up tool in Sun Life Direct.
            - listitem [ref=f494e113]: Providers should always discuss any services or costs with their clients before providing care to ensure they understand what their co-payment may be, if any, and any additional costs they might incur.
            - listitem [ref=f494e114]:
              - text: There are
              - strong [ref=f494e115]: no changes to the CDCP Billing Agreement
              - text: . Providers who accept to treat CDCP clients agree to bill and receive payment directly from Sun Life. There is no reimbursement to CDCP clients.
          - paragraph [ref=f494e116]:
            - text: Providers can direct their clients to call the Service Canada CDCP Contact Centre should they have issues with or questions about
            - link "the CDCP renewal process opens in a new tab" [ref=f494e117] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/renew.html
              - text: the CDCP renewal process
              - img "opens in a new tab" [ref=f494e119]
            - text: . Health Canada has also prepared a
            - link "renewal poster opens in a new tab" [ref=f494e121] [cursor=pointer]:
              - /url: https://drive.google.com/file/d/1onYkbbhknMx2G7wz4W8_hr6lhbK0mOsB/view
              - text: renewal poster
              - img "opens in a new tab" [ref=f494e123]
            - text: for oral health providers to print and use in their offices to help remind their CDCP patients that they need to renew their coverage.
          - heading "Applications opening for all eligible canadians" [level=2] [ref=f494e125]
          - paragraph [ref=f494e126]: Eligible Canadians of all ages can apply for the CDCP with coverage starting as early as June 1, 2025, based on when they are enrolled in the CDCP.
          - paragraph [ref=f494e127]: The Government of Canada is sending letters to Canadian residents aged 18 to 64 who may be eligible based on their 2024 adjusted family net income, encouraging them to apply.
          - paragraph [ref=f494e128]:
            - text: Canadians can visit the
            - link "Government of Canada CDCP website opens in a new tab" [ref=f494e129] [cursor=pointer]:
              - /url: https://www.canada.ca/dental
              - text: Government of Canada CDCP website
              - img "opens in a new tab" [ref=f494e131]
            - text: for more information on the application process.
          - paragraph [ref=f494e133]:
            - strong [ref=f494e134]: "Important note:"
            - text: As of May 1, all CDCP clients’ determination letter received from the Government of Canada will include their member ID, benefit coverage start date and co-payment level. With this letter they can receive care and not wait to receive their welcome package and physical CDCP member card which may take a few months to arrive.
          - heading "Payment processing time" [level=2] [ref=f494e135]
          - paragraph [ref=f494e136]:
            - text: Oral health providers who use direct deposit can receive payment within 48 hours after the
            - strong [ref=f494e137]: claim has been processed,
            - text: not based on when it is submitted. Note that while 90% of claims are processed immediately, some claims may take several days to be processed. For any questions related to claims, please call the Sun Life Contact Centre at 1-888-888-8110.
          - heading "2025 CDCP dental benefit grids" [level=2] [ref=f494e138]
          - paragraph [ref=f494e139]:
            - text: The
            - link "2025 CDCP Dental Benefit Grids" [ref=f494e140] [cursor=pointer]:
              - /url: /sl/cdcp/en/provider/dental-benefit-grids/
            - text: for all oral health providers and all provinces and territories are now available on Sun Life’s CDCP website. They include information and updates on CDCP dental procedure codes, pricing and policies.
          - paragraph [ref=f494e141]: Note that pricing for dental services is determined based on the date the service is rendered, not the date of preauthorization approval. For example, in the event that a preauthorization request was submitted in March 2025, but the corresponding treatment is not administered until May 2025, the applicable 2025 CDCP Dental Benefit Grids on the date of service would apply.
        - paragraph [ref=f494e144]:
          - text: To learn more call 1-888-888-8110, visit
          - link "Sun Life's CDCP website opens in a new tab" [ref=f494e145] [cursor=pointer]:
            - /url: https://www.sunlife.ca/sl/cdcp/en/?WT.mc_id=en-ca:direct:promo_email:provideremail:preautandresources
            - text: Sun Life's CDCP website
            - img "opens in a new tab" [ref=f494e147]
          - text: or the
          - link "Government of Canada CDCP website opens in a new tab" [ref=f494e149] [cursor=pointer]:
            - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/renew.html
            - text: Government of Canada CDCP website
            - img "opens in a new tab" [ref=f494e151]
          - text: .
