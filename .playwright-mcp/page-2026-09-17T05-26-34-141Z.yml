              - button "More information" [ref=f22e136] [cursor=pointer]
            - figure "Dental patients and providers say they can't understand why pre-authorization requests for more complex procedures are being denied by Sun Life, which administers the CDCP, often with little to no explanation. (Sébastien Bozon/AFP)" [ref=f22e139]:
              - img "Close up of person's mouth getting their teeth cleaned" [ref=f22e142]
            - heading "Social Sharing" [level=2] [ref=f22e146]
            - generic [ref=f22e148]:
              - paragraph [ref=f22e149]: After months of probing, Walter Bossé is still trying to get to the bottom of why he doesn’t qualify to get a crown covered under the Canadian Dental Care Plan (CDCP).
              - paragraph [ref=f22e150]: The public insurance program subsidizes the cost of dental care for Canadian residents with a household income below $90,000, if they don't have access to a private insurance plan.
              - paragraph [ref=f22e151]: Insurance provider Sun Life administers the CDCP and processes claims.
              - paragraph [ref=f22e153]: While most claims don’t need pre-authorization, it’s required for more expensive procedures, like crowns or partial dentures.
              - generic [ref=f22e154]:
                - emphasis [ref=f22e155]:
                  - strong [ref=f22e156]: "WATCH | Patients want more clarity over why national dental coverage claims being denied:"
                - generic [ref=f22e158]:
                  - button "Patients, dentists call for more clarity of dental coverage under national plan Play Video May 27 | Duration 3:51Close captions available" [ref=f22e160]:
                    - generic "Patients, dentists call for more clarity of dental coverage under national plan" [ref=f22e163]:
                      - generic [ref=f22e166]:
                        - paragraph [ref=f22e167]: Patients, dentists call for more clarity of dental coverage under national plan
                        - generic [ref=f22e168]:
                          - img "Play Video" [ref=f22e170]
                          - generic [ref=f22e173]: May 27
                          - generic [ref=f22e174]: "|"
                          - generic [ref=f22e176]:
                            - generic [ref=f22e177]:
                              - generic [ref=f22e178]: Duration
                              - text: 3:51
                            - img "Close captions available" [ref=f22e179]
                  - generic [ref=f22e181]: The Canadian Dental Care Plan provides care to uninsured Canadians with a household income of less than $90,000. More expensive procedures like crowns or dentures require pre-authorization. Patients and providers say those pre-approvals are frequently denied by Sun Life, which administers and processes claims.
              - paragraph [ref=f22e182]: In the last year, Bossé said he’s had multiple pre-authorization requests for crowns denied, even after his dentist submitted the proper documentation, X-rays and a detailed explanation to show why they're medically necessary.
              - paragraph [ref=f22e183]: “I was quite surprised because the dentist was convinced it was straightforward,” said Bossé, who lives in Kirkland, Que., a suburb of Montreal.
              - paragraph [ref=f22e184]: Bossé had a broken filling. Although his dentist repaired the base, the tooth needed a crown. A subsequent pre-approval request a few months later for a different tooth, which was cracked, was also denied.
              - paragraph [ref=f22e185]: “I’m like, OK, what is Sun Life doing, they are playing games,” Bossé said.
              - generic [ref=f22e187]:
                - figure:
                  - generic:
                    - generic:
                      - img "A man smiling."
                - paragraph [ref=f22e188]: Walter Bossé says he can't get a clear answer from Sun Life, which administers the CDCP and processes claims, about why he doesn't qualify to get a crown covered under the Canadian Dental Care Plan. (Submitted by Walter Bossé)
              - paragraph [ref=f22e189]: Not one to take no for an answer, the retiree called Sun Life.
              - paragraph [ref=f22e190]: “There was no explanation,” said Bossé. “It’s just denied as per the plan criteria.”
              - paragraph [ref=f22e191]: According to Sun Life’s expense estimate decision, which was reviewed by CBC, Bossé did not meet the CDCP’s policies and coverage criteria.
              - paragraph [ref=f22e192]: He then escalated the situation to a Sun Life supervisor, but they also wouldn’t specify the precise reason for the denial.
              - paragraph [ref=f22e193]: “I was flabbergasted,” said Bossé.
              - list [ref=f22e194]:
                - listitem [ref=f22e195]:
                  - link [ref=f22e196] [cursor=pointer]:
                    - /url: /news/politics/5-million-patients-covered-canadian-dental-care-plan-1.7648516
                    - paragraph [ref=f22e198]: 5 million Canadians now covered by national dental care plan, but nearly half haven't been to a dentist
              - paragraph [ref=f22e200]: The Canadian Dental Care Plan was supposed to make dental care more affordable for millions of Canadians. To date, Health Canada says over $6 billion has been paid for claims under the plan.
              - paragraph [ref=f22e201]: But Bossé believes that’s being undermined by how Sun Life is processing claims for more complex, costly procedures. He’s worried the insurer is turning down claims to mitigate payouts. The estimate for his crown was a bit over $1,600.
              - paragraph [ref=f22e202]: “I’ve been a taxpayer for what seems like forever and continue to pay taxes,” said Bossé. “I’d like to get a little for my money.”
              - heading "Complaints coast to coast" [level=2] [ref=f22e203]
              - paragraph [ref=f22e204]: Across the country in B.C, the NDP MP for Vancouver East has heard similar complaints from several of her constituents.
              - paragraph [ref=f22e205]: “They should not have to battle the insurance company to try and figure out what it is that they might be doing wrong,” said Jenny Kwan.
              - paragraph [ref=f22e206]: “For all we know, they might not be doing anything wrong.”
              - paragraph [ref=f22e207]: In one case, her office intervened after a resident’s pre-authorization request for dentures was rejected.
              - paragraph [ref=f22e208]: “He literally couldn’t eat,” said Kwan. “We had to fight tooth and nail to only get partial coverage.”
              - paragraph [ref=f22e209]: Other constituents in her riding were turned down for crowns. Kwan says neither her office nor the dentist clinics can “make heads or tails out of it.”
              - generic [ref=f22e211]:
                - figure:
                  - generic:
                    - generic:
                      - img "Jenny Kwan"
                - paragraph [ref=f22e212]: NDP MP Jenny Kwan, who represents the riding of Vancouver East, has heard from several constituents who can't understand why they were turned down for medically necessary dental work. She's calling on Canada's health minister to resolve the confusion. (Justin Tang/The Canadian Press)
              - paragraph [ref=f22e213]: She’s concerned these denials may impact people’s health, as many residents can’t afford to pay out of pocket.
              - paragraph [ref=f22e215]: Earlier this spring, Kwan sent an open letter to Canada’s Health Minister Marjorie Michel, urging her to resolve the confusion around the CDCP’s eligibility requirements.
              - paragraph [ref=f22e216]: “It doesn’t make any sense when dentists submit an application following all the rules, following the eligibility criteria for their patients and they’re being rejected,” said Kwan.
              - paragraph [ref=f22e217]: “They need to be transparent and tell people what the problem is.”
              - heading "Dental associations call for more clarity" [level=2] [ref=f22e218]
              - paragraph [ref=f22e219]: In Quebec, approximately 1.8 million people are enrolled in the CDCP and 1.5 million have received care, said Dr. Marie-Claude Desjardins, president of the Quebec Association of Dental Surgeons.
              - paragraph [ref=f22e220]: When it comes to basic care — general exams, cleaning, cavity filling and extractions — she said the program is running well.
              - paragraph [ref=f22e221]: “There are people who sometimes haven’t seen a dentist in years or who have cavities that have been left untreated for years,” said Desjardins.
              - paragraph [ref=f22e222]: But if it’s a more complicated treatment or procedure, she acknowledges it’s often unclear why coverage is being denied.
              - paragraph [ref=f22e223]: “So that’s something that we’re asking to be improved,” she said. “We’re asking for it to be simpler, clearer and more predictable for both patients and dental teams.”
              - list [ref=f22e224]:
                - listitem [ref=f22e225]:
                  - link [ref=f22e226] [cursor=pointer]:
                    - /url: /news/politics/dental-care-expansion-growing-pains-1.7583230
                    - paragraph [ref=f22e228]: Half of requests for complex dental work are being rejected under national insurance plan
              - paragraph [ref=f22e229]: The Canadian Dental Association echoed Desjardins’s call for more clarity, saying in an emailed statement that frequent denials were not only delaying timely care for patients, but creating an “administrative burden” for dentists.
              - paragraph [ref=f22e230]: Sun Life directed any questions about how the CDCP is being managed to Health Canada. The insurer would only say coverage is determined through a standardized assessment process that applies the CDCP’s policies. The clinical eligibility criteria were developed by Health Canada.
              - 'heading "Not all pre-authorization requests approved: Health Canada" [level=2] [ref=f22e231]'
              - paragraph [ref=f22e232]:
                - text: This is not the first time the national insurance program has faced scrutiny for a high number of claim rejections.
                - link "Last year" [ref=f22e233] [cursor=pointer]:
                  - /url: https://www.cbc.ca/news/politics/dental-care-expansion-growing-pains-1.7583230
                - text: ", when the program was fully expanded to 18-64 year olds, half of the requests for complex dental work were turned down."
              - paragraph [ref=f22e234]: At the time, Health Canada said it was caused by several factors, including a high volume of submissions that were missing information.
              - paragraph [ref=f22e235]: “Sun Life continues to process a high volume of claims for the CDCP in a very efficient manner, with faster turnaround times than many other plans,” said Karine LeBlanc, a spokesperson for Health Canada, in an email last week.
              - paragraph [ref=f22e236]: The most common reasons for denials are incomplete submissions, such as missing X-rays, insufficient evidence that the clinical criteria has been met, duplicate requests and requests for services not covered under the program such as implants or bridges, said LeBlanc.
              - generic [ref=f22e238]:
                - figure:
                  - generic:
                    - generic:
                      - img "dental care"
                - paragraph [ref=f22e239]: Health Canada says Canadians should ask their dentist about any additional costs not covered by the CDCP. They should also be aware of the total amount they'll need to pay directly to their provider before accepting or starting treatment. (Jean-François Benoit/Radio-Canada)
              - paragraph [ref=f22e240]: She went on to say that the CDCP does not have annual spending limits, but relies on clinical criteria that may be more stringent than other plans. As a result, not all pre-authorization requests are approved.
              - paragraph [ref=f22e241]: “The CDCP is not a free dental care plan,” wrote LeBlanc.
              - paragraph [ref=f22e242]: Dentists sometimes charge more than the CDCP’s established fees, so only a portion of the cost may be reimbursed.
              - paragraph [ref=f22e243]: Household income determines what percentage the government pays. The remaining difference is paid by the patient.
              - paragraph [ref=f22e244]: LeBlanc said Health Canada has updated the explanation of benefit statements — a breakdown of what services are covered, how much the plan paid and the patient’s final share of the bill.
              - paragraph [ref=f22e245]: It’s also given dentists fact sheets to help better explain eligibility requirements with their patients.
              - list [ref=f22e246]:
                - listitem [ref=f22e247]:
                  - link [ref=f22e248] [cursor=pointer]:
                    - /url: /news/indigenous/nihb-dental-care-indigenous-9.7030503
                    - paragraph [ref=f22e250]: Dental care benefits for First Nations and Inuit falling behind Canadian standards, say dentists
              - paragraph [ref=f22e251]: LeBlanc said Canadians should ask their dentist about any additional costs not covered by the plan. They should also be aware of the total amount they’ll need to pay directly to their provider before accepting and starting treatment.
              - paragraph [ref=f22e252]: Since Bossé’s dental claims were rejected under the CDCP, his wife had a crown replaced.
              - paragraph [ref=f22e253]: Her pre-approval request for coverage was also denied without explanation.
              - paragraph [ref=f22e254]: She paid for it out of pocket.
              - paragraph [ref=f22e255]: “You can be sure that our dental costs will be claimed as medical expenses on our next tax return,” said Bossé.
