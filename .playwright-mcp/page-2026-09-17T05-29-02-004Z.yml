    - article [ref=f487e42]:
      - heading "CDCP Oral Health Provider Newsletter Vol. 2 – November 4, 2025" [level=1] [ref=f487e43]
      - paragraph [ref=f487e45]: This message was created jointly with the Government of Canada.
      - generic [ref=f487e49]:
        - generic [ref=f487e51]:
          - 'heading "Canadian Dental Care Plan: Oral Health Provider News" [level=2] [ref=f487e52]'
          - paragraph [ref=f487e53]: This is your periodic oral health provider update to help keep you and your staff informed of the latest Canadian Dental Care Plan (CDCP) news.
          - paragraph [ref=f487e54]:
            - strong [ref=f487e55]: "CDCP Statistics at a glance as of September 30, 2025:"
          - list [ref=f487e56]:
            - listitem [ref=f487e57]: Close to 3 million Canadians have received services
            - listitem [ref=f487e58]: Over 27K eligible oral health-providers are participating in the CDCP
            - listitem [ref=f487e59]: More than 5.5 million Canadians have been deemed eligible for CDCP services
          - paragraph [ref=f487e60]:
            - text: CDCP statistics are updated on a monthly basis and are found on
            - link "the Government of Canada CDCP statistics webpage opens in a new tab" [ref=f487e61] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/statistics.html
              - text: the Government of Canada CDCP statistics webpage
              - img "opens in a new tab" [ref=f487e63]
            - text: .
          - heading "Commercial laboratory fees reimbursement update" [level=2] [ref=f487e65]
          - paragraph [ref=f487e66]:
            - text: As of October 17, 2025,
            - strong [ref=f487e67]: reasonable & customary amounts are now applied to commercial laboratory fees
            - text: for CDCP claims. Consult the
            - link "How are commercial laboratory costs calculated" [ref=f487e68] [cursor=pointer]:
              - /url: /sl/cdcp/en/support/oral-health-provider-faq/#commercial-laboratory-costs
            - text: FAQ for details.
          - heading "Member Eligibility – Change in coverage" [level=2] [ref=f487e69]
          - paragraph [ref=f487e70]: Member eligibility and/or coverage level under the CDCP may change over the course of a benefit period as a result of additional review/reassessment based on tax filing information, voluntarily withdraw from the CDCP, etc.
          - paragraph [ref=f487e71]:
            - strong [ref=f487e72]: As a CDCP client’s coverage under the plan can change at any time during the benefit period
            - text: ;
            - strong [ref=f487e73]: it is important and also your responsibility to validate a CDCP client’s coverage at each visit and before providing and billing for services or treatments.
          - paragraph [ref=f487e74]: If you have questions related to your CDCP client’s coverage please call Sun Life’s CDCP Contact Centre at 1-888-888-8110.
          - paragraph [ref=f487e75]: "If your CDCP clients have questions about their eligibility under the plan, they can call Service Canada at 1-833-537-4342 (TTY: 1-833-677-6262)."
          - paragraph [ref=f487e76]:
            - text: Consult the FAQ for more details on
            - link "“What if there has been a change in coverage for my CDCP clients and they are in the middle of treatment?”" [ref=f487e77] [cursor=pointer]:
              - /url: https://www.sunlife.ca/sl/cdcp/en/support/oral-health-provider-faq/#changeincoverage
            - text: .
            - strong:
              - emphasis
          - heading "Approved preauthorization submitted by one provider specialty but performed by a different provider specialty" [level=2] [ref=f487e78]
          - paragraph [ref=f487e79]: In cases where a preauthorization has been submitted, is approved and is valid for a CDCP client under one provider specialty (e.g. general practitioner), but the client chooses to complete the service with another provider specialty (e.g. denturist), the provider performing the treatment does not need to restart the preauthorization process unless their treatment plan for this CDCP client is different from what was originally submitted.
          - paragraph [ref=f487e80]: For example, a denturist would not need to submit a new preauthorization, if a preauthorization was already approved and is still valid under a general practitioner’s procedure code (e.g. complete upper denture) for the same treatment.
          - paragraph [ref=f487e81]: "Sun Life will review and pay the claim using the equivalent code for denturists. Note: the claim would be paid based on the CDCP Benefit Grid for Denturists, in this example, and the CDCP client’s coverage applicable at the time the service was rendered, which could be different than what is indicated in preauthorization Explanation of Benefits."
          - heading "How to use the CDCP Dental Benefits Guide" [level=2] [ref=f487e82]:
            - text: How to use the CDCP Dental Benefits Guide
            - strong
          - paragraph [ref=f487e83]:
            - text: The following example is provided to support oral health providers and their staff in navigating through the
            - link "CDCP Dental Benefits Guide opens in a new tab" [ref=f487e84] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
              - text: CDCP Dental Benefits Guide
              - img "opens in a new tab" [ref=f487e86]
            - text: to understand the terms and conditions and policies, including criteria, guidelines and limitations, under which the CDCP covers oral health care services for eligible CDCP clients.
          - paragraph [ref=f487e88]:
            - strong [ref=f487e89]: "Example: Crowns"
          - paragraph [ref=f487e90]: Follow these steps to navigate through the CDCP Dental Benefits Guide to find policies related to the administering of crowns to an eligible CDCP member.
          - list [ref=f487e91]:
            - listitem [ref=f487e92]:
              - strong [ref=f487e93]: Find your service of interest.
              - text: From the
              - link "Canadian Dental Care Plan – Dental Benefits Guide opens in a new tab" [ref=f487e94] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
                - text: Canadian Dental Care Plan – Dental Benefits Guide
                - img "opens in a new tab" [ref=f487e96]
              - text: homepage scroll to the ‘On this page’ section and select the desired service. For this example, we will use crowns which is found under ‘
              - strong [ref=f487e98]: 6.2 Restorative services
              - text: .’
            - listitem [ref=f487e99]:
              - strong [ref=f487e100]: Select the specific treatment.
              - text: Under ‘In this section’, select ‘
              - strong [ref=f487e101]: 6.2.5 Crowns
              - text: ’ to view important information regarding crowns.
            - listitem [ref=f487e102]:
              - strong [ref=f487e103]: Take note of the information regarding the treatment.
              - list [ref=f487e104]:
                - listitem [ref=f487e105]:
                  - strong [ref=f487e106]: ‘General Principles’.
                  - text: This section summarizes the terms of coverage.
                - listitem [ref=f487e107]:
                  - strong [ref=f487e108]: ‘Eligibility Criteria’.
                  - text: This section lists the eligibility and restorability criteria required for the tooth to be considered for coverage. This can be used as a checklist to ensure the tooth meets the criteria prior to submission. Please note this is not an exhaustive list and Sun Life also evaluates using the CDCP’s internal processes and clinical criteria.
                - listitem [ref=f487e109]:
                  - strong [ref=f487e110]: ‘Frequency limitations for crowns.’
                  - text: This section describes the coverage frequency limits.
                - listitem [ref=f487e111]:
                  - text: ‘
                  - strong [ref=f487e112]: Preauthorization documentation requirements for restorative services’.
                  - text: This section outlines the documents required for Sun Life to evaluate the treatment. This can also be used as a checklist to ensure all required documentation is included. If information is missing, it may be requested by Sun Life and/or the submission will be denied.
            - listitem [ref=f487e113]:
              - strong [ref=f487e114]: Need additional information?
              - text: "Consult ‘7.0 Appendices’ at the bottom of the page for more information, including:"
              - list [ref=f487e115]:
                - listitem [ref=f487e116]: CDCP Dental Benefit Grids for a list of eligible procedure codes
                - listitem [ref=f487e117]: Payment and reimbursement
                - listitem [ref=f487e118]: Preauthorization reconsideration process
                - listitem [ref=f487e119]: Claims verification program
                - listitem [ref=f487e120]: Exclusions
        - generic [ref=f487e122]:
          - 'heading "Explanation of Benefits: N05 code explained" [level=2] [ref=f487e123]'
          - list [ref=f487e124]:
            - listitem [ref=f487e125]: "N05 is a narrative that Sun Life generates when an oral health provider submits a claim for a service that is not covered by the CDCP. For example, if an implant is submitted (which is considered an exclusion under the CDCP) the claim or preauthorization will produce a decline. The oral health provider would receive the following message N05: This expense is not covered under your benefits plan."
            - listitem [ref=f487e126]:
              - text: Providers should continue to consult the
              - link "CDCP Dental Benefits Guide opens in a new tab" [ref=f487e127] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
                - text: CDCP Dental Benefits Guide
                - img "opens in a new tab" [ref=f487e129]
              - text: and the
              - link "CDCP Dental Benefit Grids" [ref=f487e131] [cursor=pointer]:
                - /url: /sl/cdcp/en/provider/dental-benefit-grids/
              - text: for details on what is covered and which procedure codes are under the plan.
