          - heading "More dental patients, providers baffled by lack of consistency in national plan's coverage" [level=1] [ref=f389e111]
          - heading "Health Canada says plan still new, working with associations to make improvements" [level=2] [ref=f389e112]
          - generic [ref=f389e113]:
            - figure [ref=f389e114]
            - generic [ref=f389e117]:
              - link "Leah Hendry" [ref=f389e119] [cursor=pointer]:
                - /url: /author/leah-hendry-1.3322920
              - text: · CBC News ·
              - time [ref=f389e120]: "Posted: Jun 04, 2026 4:00 AM EDT | Last Updated: June 4"
          - generic [ref=f389e121]:
            - generic [ref=f389e122]:
              - button "Play audio" [ref=f389e124] [cursor=pointer]:
                - img "Play" [ref=f389e125]
              - img "Text to Speech Icon" [ref=f389e131]
              - generic [ref=f389e132]:
                - generic [ref=f389e133]: Listen to this article
                - generic [ref=f389e134]: Estimated 6 minutes
              - button "More information" [ref=f389e136] [cursor=pointer]
            - figure "Dr. Melvin Lee, an Ottawa dentist, works on a patient who is enrolled in the Canadian Dental Care Plan. He thinks Health Canada should consult with front-line dentists more frequently to better understand what needs to be improved or tweaked in the plan. (Jason MacLellan/CBC)" [ref=f389e139]:
              - img "Dentist and hygienist leaning over patient at dentist office." [ref=f389e142]
            - heading "Social Sharing" [level=2] [ref=f389e145]
            - generic [ref=f389e146]:
              - paragraph [ref=f389e147]: Cameron Brown knows how important first impressions are when searching for a job.
              - paragraph [ref=f389e148]: So when he got a letter on his 65th birthday saying he qualified for the Canadian Dental Care Plan (CDCP) last year, he was thrilled.
              - paragraph [ref=f389e149]: Brown had two teeth that needed to be replaced.
              - paragraph [ref=f389e151]: But when his dentist submitted the pre-authorization request for dentures, it was turned down.
              - paragraph [ref=f389e152]: “First of all, they said it wasn’t essential,” said Brown.
              - paragraph [ref=f389e153]: “I remember my sister saying well, ‘He’s an unemployed senior, how do they expect him to get work with two missing front teeth off to the side?’”
              - paragraph [ref=f389e154]: His sister ended up fronting the bill, to the tune of $1,000.
              - paragraph [ref=f389e155]: Brown’s dentist appealed the insurance provider’s decision, but that request was also rejected.
              - paragraph [ref=f389e156]: “I never got a penny from them,” said Cameron, who lives in Toronto.
              - generic [ref=f389e158]:
                - figure [ref=f389e159]:
                  - img "Man with white hair and glasses" [ref=f389e162]
                - paragraph [ref=f389e163]: Cameron Brown, a low-income senior who lives in Toronto, badly needed dentures, but was turned down for coverage under the Canadian Dental Care Plan. (Submitted by Cameron Brown)
              - paragraph [ref=f389e164]:
                - text: Brown is one of dozens of Canadians who contacted CBC following a
                - link "story" [ref=f389e165] [cursor=pointer]:
                  - /url: https://www.cbc.ca/news/canada/montreal/dental-work-national-plan-coverage-9.7212333
                - text: last month about the challenges many dental patients and providers are experiencing getting coverage under the national plan.
              - paragraph [ref=f389e166]: The CDCP was rolled out by the federal government in 2024 to help improve access to dental care for uninsured Canadians with a household income under $90,000 a year.
              - paragraph [ref=f389e167]:
                - text: But questions around
                - link "eligibility" [ref=f389e168] [cursor=pointer]:
                  - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/qualify.html
                - text: and a lack of clarity about why some patients are denied coverage remain major barriers.
              - heading "Growing pains?" [level=2] [ref=f389e169]
              - paragraph [ref=f389e170]: More than 6.5 million Canadians are eligible for care under the CDCP.
              - paragraph [ref=f389e172]: As of April 2026, more than 4.3 million people have already received care, totalling over $6 billion in claims, according to Health Canada.
              - paragraph [ref=f389e173]: It’s a lot of money, but the federal government has assured the Canadian Dental Association the long-term sustainability of the program is not at risk, said the association's president, Dr. Kirk Preston.
              - paragraph [ref=f389e174]: But consistency and predictability around what is and isn't covered continue to be problems, said Preston.
              - paragraph [ref=f389e175]: Some people have cancelled treatment because they don’t have the time or energy to go through a lengthy appeals process if their pre-authorization request is rejected, he added.
              - paragraph [ref=f389e176]: “When treatment is postponed or denied, the consequences can lead to irreversible tooth loss, often leading to more complex dental issues,” said Preston.
              - paragraph [ref=f389e177]: Dr. Melvin Lee runs a dental clinic in downtown Ottawa.
              - paragraph [ref=f389e178]: His office has run into similar challenges trying to get pre-approval for crowns. More complex procedures, such as crowns or dentures, need to be pre-authorized before treatment can proceed.
              - generic [ref=f389e180]:
                - figure:
                  - generic:
                    - generic:
                      - img "Dentist in his exam room smiling"
                - paragraph [ref=f389e181]: Ottawa dentist Dr. Melvin Lee says all but one of the pre-determination requests his office sent in for crowns was rejected by Sun Life, which administers the CDCP and processes claims. (Jason MacLellan/CBC)
              - paragraph [ref=f389e182]: Out of dozens of requests, all but one was denied by insurance provider Sun Life, which administers the CDCP and processes claims.
              - paragraph [ref=f389e183]: “It’s tremendously frustrating when we’re receiving rejection after rejection after rejection without any details or instructions, recommendations, action items as to why such a pre-determination was rejected,” said Lee.
              - paragraph [ref=f389e184]: He thinks Health Canada should consult with front-line dentists more frequently about the challenges they are having with the program to figure out what needs to be improved.
              - heading "Basic, preventive care also limited" [level=2] [ref=f389e185]
              - paragraph [ref=f389e186]: The government also needs to clear up how much coverage patients receive for basic, preventive care, said Kathryn Taylor, a dental administrator with 40 years of experience.
              - paragraph [ref=f389e187]: “The periodontal part of the plan is woefully inadequate,” said Taylor, who works at a dental office in Victoria, B.C.
              - paragraph [ref=f389e188]: Periodontal care includes cleaning, scaling, root planing, polishing and fluoride. These treatments can help prevent gum disease as well as tooth and bone loss.
              - paragraph [ref=f389e189]: Dental plans that are privately or employee funded usually have a set amount of cleaning that’s covered in a calendar year, said Taylor. But some patients need to go more often, so many plans have an annual maximum.
              - paragraph [ref=f389e190]: But the CDCP’s fee guide does not mirror anything Taylor has seen provincially.
              - paragraph [ref=f389e191]: Even cases she thought would be a slam dunk to qualify for more coverage were denied, with no justification other than they do not meet the criteria.
              - paragraph [ref=f389e192]: “So we’re having to educate patients about what they’re going to have to pay because there will always be a balance,” said Taylor.
              - paragraph [ref=f389e193]: She thinks the CDCP should set an annual limit. That makes it clearer for patients and may also help avoid any potential abuse.
              - paragraph [ref=f389e194]: “You don’t have carte blanche to do everything,” said Taylor. “There are practitioners out there that will over treat.”
              - paragraph [ref=f389e195]: She also says Sun Life needs to ensure only procedures that are medically necessary are approved.
              - generic [ref=f389e197]:
                - figure:
                  - generic:
                    - generic:
                      - img "Elderly lady with white hair smiling on balcony"
                - paragraph [ref=f389e198]: Sharon Cameron, who lives in Mont-Saint-Hilaire, Que., is worried the national dental plan may be scrapped if it's abused. (Submitted by Sharon Cameron)
              - paragraph [ref=f389e199]: Sharon Cameron is worried some dentists may be exploiting the program.
              - paragraph [ref=f389e200]: Like Brown, Cameron, who is in her 70s, was relieved to get coverage under the CDCP. She’d been cautious with her teeth, but was grateful to have a cleaning and X-rays done.
              - paragraph [ref=f389e201]: But after her exam, she was told she needed some fillings replaced and was given options for an action plan.
              - paragraph [ref=f389e202]: “One of them, total, after seven appointments, would have been $11,411,” said Cameron, who lives in Mont-Saint-Hilaire, Que.
              - paragraph [ref=f389e203]: She felt the action plan was a money grab.
              - paragraph [ref=f389e204]: “Is there anyone really monitoring the dentist and what they’re doing here?” said Cameron, who fears the CDCP will be scrapped if it's abused.
              - paragraph [ref=f389e205]: “I don’t want to lose it. It’s very important to people, but it has to not be misused.”
              - heading "Checklists, videos available" [level=2] [ref=f389e206]
              - paragraph [ref=f389e207]: A spokesperson for Health Canada said there is a “robust” verification process to make sure that only procedures that meet the plan's criteria are covered.
              - paragraph [ref=f389e208]: There are also safeguards in place, including audits, to avoid abuse.
              - paragraph [ref=f389e209]:
                - text: Health Canada says CDCP members and dental care providers can review the benefits
                - link "guide" [ref=f389e210] [cursor=pointer]:
                  - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
                - text: online. There are videos and checklists available.
              - paragraph [ref=f389e211]: The federal government meets with national and provincial-territorial associations regularly to share information, gather their feedback and improve the plan’s administration and processes, said Karine LeBlanc, a spokesperson for Health Canada.
              - paragraph [ref=f389e212]: “We’ll continue to work with associations to explore what additional tools may be helpful,” said LeBlanc in an email to CBC.
              - paragraph [ref=f389e213]: Brown hopes the government can sort out the confusion.
              - paragraph [ref=f389e214]: “I know there are people out there who need these kinds of services," he said.
              - paragraph [ref=f389e215]: “They need someone to go in there and make it work.”
