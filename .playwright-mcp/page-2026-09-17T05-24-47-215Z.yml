        - heading "Overview and participation" [level=2] [ref=f8e121]
        - generic [ref=f8e123]:
          - heading "What's the Canadian Dental Care Plan (CDCP)?" [level=3] [ref=f8e128]
          - paragraph [ref=f8e133]:
            - text: The
            - link "CDCP opens in a new tab" [ref=f8e134] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan.html
              - text: CDCP
              - img "opens in a new tab" [ref=f8e136]
            - text: will help ease financial barriers for Canadian residents that have an adjusted family net income of less than $90,000 and don’t have access to dental coverage.
        - generic [ref=f8e139]:
          - heading "Which services are included in the CDCP?" [level=3] [ref=f8e144]
          - paragraph [ref=f8e149]:
            - text: View the
            - link "services that are covered opens in a new tab" [ref=f8e150] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/coverage.html
              - text: services that are covered
              - img "opens in a new tab" [ref=f8e152]
            - text: by the CDCP.
        - generic [ref=f8e155]:
          - heading "How can oral health providers participate in the CDCP?" [level=3] [ref=f8e160]
          - generic [ref=f8e164]:
            - paragraph [ref=f8e165]: Oral health providers can confirm their participation by signing up with Sun Life or by participating on a claim-by-claim basis.
            - paragraph [ref=f8e166]:
              - text: Oral health providers can sign up online through
              - link "Sun Life Direct opens in a new tab" [ref=f8e167] [cursor=pointer]:
                - /url: https://www.sunnet.sunlife.com/signin/provider/e/home.wca?
                - text: Sun Life Direct
                - img "opens in a new tab" [ref=f8e169]
              - text: . They can sign in to their existing Sun Life Direct account and select the "Sign up" button to confirm their participation.
            - paragraph [ref=f8e171]:
              - text: Don’t have a Sun Life Direct account? Simply print and complete the
              - link "PDF provider participation form opens in a new tab" [ref=f8e172] [cursor=pointer]:
                - /url: /content/dam/sunlife/regional/canada/documents/cxo/cdcp/paper-provider-participation-form-e.pdf
                - generic [ref=f8e173]: PDF
                - text: provider participation form
                - img "opens in a new tab" [ref=f8e177]
              - text: ", then mail it back to the address provided."
            - heading "Advantages of signing up for the CDCP" [level=3] [ref=f8e179]
            - paragraph [ref=f8e180]: "Oral health providers who sign up to participate in the CDCP can:"
            - list [ref=f8e181]:
              - listitem [ref=f8e182]: Confirm coverage for CDCP clients through Sun Life Direct.
              - listitem [ref=f8e183]: Appear in the CDCP Provider Search Tool.
            - paragraph [ref=f8e184]: Providers have the option to opt-out at any time by contacting Sun Life's CDCP Contact Centre at 1-888-888-8110.
        - generic [ref=f8e186]:
          - heading "How and when will oral health providers be alerted that their participation in the CDCP is confirmed?" [level=3] [ref=f8e191]
          - generic [ref=f8e195]:
            - paragraph [ref=f8e196]: When an oral health provider confirms their participation in the CDCP through Sun Life Direct, they’ll receive a confirmation email immediately.
            - paragraph [ref=f8e197]: When an oral health provider confirms their participation in the CDCP by completing and submitting a paper form, they’ll receive their confirmation (via the communication preference that they selected) within 7 business days.
        - generic [ref=f8e199]:
          - heading "Do oral health providers need to confirm their participation in the CDCP for each office, if they work at multiple offices?" [level=3] [ref=f8e204]
          - paragraph [ref=f8e209]: Oral health providers only need to confirm their participation in the CDCP once, even if they work at multiple locations across Canada.
        - generic [ref=f8e211]:
          - heading "How will oral health providers validate that a patient is eligible for the CDCP?" [level=3] [ref=f8e216]
          - generic [ref=f8e220]:
            - paragraph [ref=f8e221]: Sun Life will send enrolled Canadian residents a member card that includes the CDCP plan number and their member ID.
            - paragraph [ref=f8e222]: On Sun Life Direct, oral health providers can validate a patient’s eligibility for services and frequency limits before confirming any dental care appointments and prior to patient treatment.
            - paragraph [ref=f8e223]: Oral health providers that aren’t on Sun Life Direct, should confirm a patient’s eligibility by calling the Sun Life CDCP Contact Centre at 1-888-888-8110 before confirming any dental care appointments and prior to patient treatment.
        - generic [ref=f8e225]:
          - heading "How is personal information handled?" [level=3] [ref=f8e230]
          - paragraph [ref=f8e235]:
            - text: The Canadian Dental Care Plan (CDCP) is a federal government program. Sun Life’s role with the CDCP is to provide dental claims processing services. Provider and member personal information is only used when administering the CDCP and is handled in accordance with the
            - emphasis [ref=f8e236]: Privacy Act
            - text: . For more information, visit the
            - link "CDCP Privacy" [ref=f8e237] [cursor=pointer]:
              - /url: https://canada.ca/dental-privacy
            - text: page.
        - heading "Coverage, claims and payments" [level=2] [ref=f8e240]
        - generic [ref=f8e242]:
          - heading "How much coverage will Canadian residents receive?" [level=3] [ref=f8e247]
          - generic [ref=f8e251]:
            - paragraph [ref=f8e252]: The CDCP will reimburse a percentage of any eligible expense at the CDCP established fees, but some CDCP Clients may have a co-payment based on the adjusted family net income (AFNI).
            - list [ref=f8e253]:
              - listitem [ref=f8e254]: AFNI under $70,000 there is no co-pay.
              - listitem [ref=f8e255]: AFNI between $70,000 and $79,999 there is a co-pay of 40%, the plan will cover 60% of the eligible expenses.
              - listitem [ref=f8e256]: AFNI between $80,000 and $89,999 there is a co-pay of 60%, the plan will cover 40% of the eligible expenses.
            - paragraph [ref=f8e257]: CDCP Clients may have to pay additional fees (beyond the potential co-payment), if the cost of their oral health care services is more than what the CDCP will reimburse based on the established CDCP fees or if they agree to receive care that isn’t covered under the plan.
        - generic [ref=f8e259]:
          - heading "Why are CDCP fees different than the provincial and territorial fee guide for oral health providers?" [level=3] [ref=f8e264]
          - generic [ref=f8e268]:
            - paragraph [ref=f8e269]:
              - text: The CDCP fees, as described in the CDCP dental
              - strong [ref=f8e270]
              - text: benefit grids, have been designed using the existing methodology of other federal dental programs to pay a fair rate to oral health providers for evidence-based procedures.
            - paragraph [ref=f8e271]: The plan will reimburse oral health providers a percentage of any eligible expense, up to the approved CDCP established fees, which may differ from what the provider charges.
            - paragraph [ref=f8e272]: The CDCP will only pay for oral health care services covered within the CDCP and in accordance with the CDCP established fees.
        - generic [ref=f8e274]:
          - heading "Where can oral health providers find the established benefit grids?" [level=3] [ref=f8e279]
          - paragraph [ref=f8e284]:
            - text: For more information, view the
            - link "CDCP dental benefit grids" [ref=f8e285] [cursor=pointer]:
              - /url: /sl/cdcp/en/provider/dental-benefit-grids/
            - text: page.
        - generic [ref=f8e287]:
          - heading "What’s a co-pay?" [level=3] [ref=f8e292]
          - generic [ref=f8e296]:
            - paragraph [ref=f8e297]: A co-pay or co-payment is the percentage of CDCP fees that is not covered by the CDCP, and that people covered under the CDCP will have to pay directly to the oral health provider.
            - paragraph [ref=f8e298]: Those without or with co-payment, may still face additional charges if their oral health providers charge more than the CDCP established fees.
        - generic [ref=f8e300]:
          - heading "How will oral health providers submit claims to the CDCP?" [level=3] [ref=f8e305]
          - generic [ref=f8e309]:
            - paragraph [ref=f8e310]: Oral health providers can submit claims for CDCP clients through Electronic Data Interchange (EDI) or by paper claim (starting November 1, 2024).
            - paragraph [ref=f8e311]: Both the oral health provider and the member or the parent/legal guardian or representative will need to sign the paper claim form to validate that the treatment was proposed or completed. Also, the assignment box on paper claims must be signed by the member or the parent/legal guardian or representative in order for the paper claim to be processed. Paper claims received without the member’s or the parent/legal guardian’s or representative’s signature will be denied.
            - paragraph [ref=f8e312]: "Paper claims should be sent to Sun Life at the following address:"
            - paragraph [ref=f8e313]: Sun Life Assurance Company of Canada Canadian Dental Care Plan (CDCP) PO Box 99865 STND Montreal, QC H3C 0E6
        - generic [ref=f8e315]:
          - heading "When can oral health providers start submitting claims?" [level=3] [ref=f8e320]
          - generic [ref=f8e324]:
            - paragraph [ref=f8e325]: The CDCP will be rolled out using a phased approach (starting with seniors, persons with disabilities and children under 18). Individuals covered under the CDCP will be able to visit an oral health provider as early as May 2024 (depending on when they apply).
            - paragraph [ref=f8e326]: The CDCP coverage start date will vary from one person to another. An individual’s coverage date is based on when their application was received and when they were enrolled in the CDCP.
            - paragraph [ref=f8e327]: It’s important for oral health providers to validate their patient’s effective coverage date before confirming an appointment for those covered under the CDCP.
        - generic [ref=f8e329]:
          - heading "Does the CDCP cover emergency services?" [level=3] [ref=f8e334]
          - paragraph [ref=f8e339]: The CDCP basket of services is designed to cover urgent services needed outside a hospital or emergency health care setting, or that are needed until the patient can be stabilized and brought back for any needed follow up treatment. For instance, emergency exams, caries, trauma and pain control, pulpotomies/pulpectomies and open and drain services are covered without preauthorization requirements.
        - generic [ref=f8e341]:
          - heading "Does the CDCP define emergency care?" [level=3] [ref=f8e346]
          - generic [ref=f8e350]:
            - paragraph [ref=f8e351]: The CDCP does not define emergency care. It is up to oral health providers to determine the urgency of a patient’s needs. It is important to distinguish between "emergent care," which refers to situations that pose an immediate threat to life or health and require immediate action (such as oral-facial trauma), and situations that are serious but not clinical emergencies (such as the distance a patient travels for care, or an intent to avoid follow-up visits).
            - paragraph [ref=f8e352]: Many emergency care needs are treated in hospitals and insured under provincial and territorial health systems. These services should continue to be billed or paid for through those systems and not billed under the CDCP.
        - generic [ref=f8e354]:
          - heading "Does the CDCP cover emergency exams?" [level=3] [ref=f8e359]
          - generic [ref=f8e363]:
            - paragraph [ref=f8e364]: Emergency exams by dentists are covered, and there are no preauthorization requirements, frequency limits or maximums for this type of exam.
            - paragraph [ref=f8e365]: Emergency or specific examinations submitted with recall services will be considered as a recall examination and frequency limitations for recall examinations will be applied.
            - paragraph [ref=f8e366]: Verification processes are in place to ensure accurate claim codes are being submitted.
        - generic [ref=f8e368]:
          - heading "Can patients submit claims directly for CDCP services?" [level=3] [ref=f8e373]
          - paragraph [ref=f8e378]: Claims for services covered under the CDCP must be submitted by a participating CDCP oral health provider directly to Sun Life.
        - generic [ref=f8e380]:
          - heading "Can oral health providers submit paper claims for unclaimed services administered to CDCP clients?" [level=3] [ref=f8e385]
          - generic [ref=f8e389]:
            - paragraph [ref=f8e390]: Yes, starting November 1, 2024, oral health providers can submit CDCP paper claims for services administered since May 1, 2024. CDCP clients must have been eligible at the time the service was administered for claims to be paid.
            - paragraph [ref=f8e391]: Note, that if a CDCP client/patient subsequently sought the same service at a clinic who submitted EDI before November, the claim for that patient’s treatment could be denied.
        - generic [ref=f8e393]:
          - heading "Are CDCP clients required to sign the Assignment of Benefits on paper claim forms?" [level=3] [ref=f8e398]
          - paragraph [ref=f8e403]: When submitting paper claims to Sun Life, providers must include CDCP members' signatures in the Assignment of Benefits section of the claim form to ensure that claims are not declined, which will result in claims processing and payment delays.
        - generic [ref=f8e405]:
          - heading "How will oral health providers receive claim payments?" [level=3] [ref=f8e410]
          - generic [ref=f8e414]:
            - paragraph [ref=f8e415]: Sun Life encourages oral health providers to sign up for electronic fund transfer (EFT) to receive their claim payments via direct deposit within days. Direct deposit forms are available on Sun Life Direct.
            - paragraph [ref=f8e416]: Otherwise, Sun Life will send oral health providers their claim payments through monthly cheques.
        - generic [ref=f8e418]:
          - heading "How can oral health providers submit CDCP claims and preauthorizations during a postal disruption?" [level=3] [ref=f8e423]
          - generic [ref=f8e427]:
            - paragraph [ref=f8e428]:
              - strong [ref=f8e429]: Electronic Data Interchange (EDI) submission
              - text: through your practice management software is the
              - strong [ref=f8e430]: fastest and easiest way
              - text: to get preauthorization requests approved. Ensure that your practice management software also supports submission of attachments through EDI.
            - paragraph [ref=f8e431]: "If you’re unable to submit through EDI, CDCP claims and preauthorization requests can be sent by courier to the following address:"
            - paragraph [ref=f8e432]: Sun Life Assurance Company of Canada CDCP Claims 1155 Rue Metcalfe, Suite 1024 Montreal, QC H3B 2V6
            - paragraph [ref=f8e433]:
              - text: To avoid potential delays, please ensure you
              - strong [ref=f8e434]: include all applicable supporting documentation
              - text: . CDCP preauthorization requests have different documentation requirements than other insurance plans, including a requirement to provide treatment plan details.
              - strong [ref=f8e435]
              - text: Consult the
              - link "Preauthorization Supporting Documentation Reference Guide opens in a new tab" [ref=f8e436] [cursor=pointer]:
                - /url: https://www.sunlife.ca/content/dam/sunlife/regional/canada/documents/cxo/cdcp/cdcp-csi-en.pdf#page=5
                - text: Preauthorization Supporting Documentation Reference Guide
                - img "opens in a new tab" [ref=f8e438]
              - text: for a quick summary of the required documents, or consult the
              - link "CDCP Dental Benefits Guide opens in a new tab" [ref=f8e440] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
                - text: CDCP Dental Benefits Guide
                - img "opens in a new tab" [ref=f8e442]
              - text: .
        - generic [ref=f8e445]:
          - heading "How does the CDCP cover clients with more complex needs?" [level=3] [ref=f8e450]
          - generic [ref=f8e454]:
            - paragraph [ref=f8e455]: The CDCP is designed to cover a range of individual oral health care needs and circumstances to meet the needs of many CDCP clients without requiring preauthorization. In other cases, a client’s more complex needs may be met through preauthorization, which can be used to request coverage above frequency limits.
            - paragraph [ref=f8e456]: Preauthorization requests are adjudicated on an individual basis, taking into consideration factors such as the client’s oral health status and medical conditions, including disabilities.
        - heading "Preauthorization, Post-Determination, and Complex Needs" [level=2] [ref=f8e459]
        - generic [ref=f8e461]:
          - heading "Will some oral health services require preauthorization?" [level=3] [ref=f8e466]
          - generic [ref=f8e470]:
            - paragraph [ref=f8e471]: Most services covered under the CDCP will not require prior approval (up to certain frequency limits). Some services, such as major oral health services or services above the established frequency limits, will require preauthorization. Oral health providers should consult the claims submission information and CDCP Dental Benefits Guide for details.
            - paragraph [ref=f8e472]: Services that require preauthorization have been eligible as of November 1, 2024.
        - generic [ref=f8e474]:
          - heading "How do oral health providers submit a preauthorization request?" [level=3] [ref=f8e479]
          - generic [ref=f8e483]:
            - paragraph [ref=f8e484]: As of November 1, 2024, providers can request preauthorization by submitting the requested procedure code(s) along with required supporting documentation and information to Sun Life through digital submission via Electronic Data Interchange (EDI) or by mail.
            - heading "Submission by EDI:" [level=3] [ref=f8e485]
            - paragraph [ref=f8e486]: Some practice management software programs have the capability to include digital attachments as part of an electronic (EDI) submission. Providers are encouraged to confirm the capability of their software program to understand whether it supports digital submissions before submitting a request for preauthorization.
            - paragraph [ref=f8e487]: If a practice management software does not have the capability to submit supporting documents as attachments, the claim and supporting documentation will need to be mailed to the CDCP dedicated PO Box listed below.
            - heading "Submission by mail:" [level=3] [ref=f8e488]
            - paragraph [ref=f8e489]: Sun Life Assurance Company Canadian Dental Care Plan (CDCP) PO Box 99865 STND Montreal, QC H3C 0E6
        - generic [ref=f8e491]:
          - heading "What documents need to be included to request a preauthorization?" [level=3] [ref=f8e496]
          - paragraph [ref=f8e501]:
            - text: Document requirements vary depending on the service requested. Please consult the
            - link "CDCP Dental Benefits Guide opens in a new tab" [ref=f8e502] [cursor=pointer]:
              - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
              - text: CDCP Dental Benefits Guide
              - img "opens in a new tab" [ref=f8e504]
            - text: for information, and the
            - link "Preauthorization Supporting Documentation Reference Guide opens in a new tab" [ref=f8e506] [cursor=pointer]:
              - /url: https://www.sunlife.ca/content/dam/sunlife/regional/canada/documents/cxo/cdcp/cdcp-csi-en.pdf#page=5
              - text: Preauthorization Supporting Documentation Reference Guide
              - img "opens in a new tab" [ref=f8e508]
            - text: for a quick summary of the required documents.
        - generic [ref=f8e511]:
          - heading "What if a patient’s treatment can’t wait for preauthorization?" [level=3] [ref=f8e516]
          - generic [ref=f8e520]:
            - paragraph [ref=f8e521]: Post-determination is the process through which coverage for procedures typically requiring preauthorization is administratively reviewed and adjudicated after the services have been rendered. Post-determination is intended to be used rarely, and only in emergent clinical situations.
            - paragraph [ref=f8e522]:
              - text: The
              - link "CDCP Dental Benefits Guide opens in a new tab" [ref=f8e523] [cursor=pointer]:
                - /url: https://www.canada.ca/en/services/benefits/dental/dental-care-plan/guide.html
                - text: CDCP Dental Benefits Guide
                - img "opens in a new tab" [ref=f8e525]
              - text: and the
              - link "Dental Benefits Grids" [ref=f8e527] [cursor=pointer]:
                - /url: /sl/cdcp/en/provider/dental-benefit-grids/
              - text: outline the plan’s policies, including which services require preauthorization or post-determination.
            - paragraph [ref=f8e528]: Post-determination requests will be assessed based on the same clinical criteria as preauthorization requests, with an additional rationale explaining the emergent clinical situation for the post-determination submission. Approval is not guaranteed.
            - paragraph [ref=f8e529]: Preauthorization is always highly recommended, but when not possible, it is important for the provider to have clear conversations with the client about their potential financial responsibility before treatment begins.
            - paragraph [ref=f8e530]: Requests for post-determination must include all the documentation that would be required to request preauthorization for the same service, in addition to a rationale explaining why post-determination is being sought instead of preauthorization.
        - generic [ref=f8e532]:
          - heading "What is the expected decision turnaround time for a preauthorization request?" [level=3] [ref=f8e537]
          - paragraph [ref=f8e542]: The turnaround times for preauthorization requests varies based on the volume and complexity of submissions received. To help minimize delays, please do not submit the same request multiple times. You will only receive a decision once your submission has been processed. Thank you for your patience.
        - generic [ref=f8e544]:
          - heading "Once approved, how long are preauthorization decisions valid?" [level=3] [ref=f8e549]
          - paragraph [ref=f8e554]: Generally, a preauthorization will be valid for 12 months from the date of approval. Approved preauthorizations for select preventive and periodontal services are valid for 24 months, provided that the client is still eligible for coverage under the CDCP.
        - generic [ref=f8e556]:
          - heading "Will sedation and general anesthesia require preauthorization/post-determination?" [level=3] [ref=f8e561]
          - generic [ref=f8e565]:
            - paragraph [ref=f8e566]:
              - text: The CDCP covers 4 sessions in 12 months of nitrous oxide, oral sedation and nitrous with oral sedation without preauthorization. The CDCP also covers parenteral conscious sedation and combined techniques of inhalation plus IV (intravenous) and/or IM (intramuscular) injection, deep sedation, and general anesthesia with preauthorization. Based on their scope of practice, oral surgeons do not require preauthorization for sedation and general anesthesia up to frequency limits noted in the
              - link "Dental Benefit Grids" [ref=f8e567] [cursor=pointer]:
                - /url: /sl/cdcp/en/provider/dental-benefit-grids/
              - text: .
            - paragraph [ref=f8e568]: Additional sessions can be requested through preauthorization or post-determination in emergency cases where preauthorization cannot be sought.
        - generic [ref=f8e570]:
          - heading "How do oral health providers treat patients with the more complex needs that require more care than what the CDCP usually provides?" [level=3] [ref=f8e575]
          - generic [ref=f8e579]:
            - paragraph [ref=f8e580]: The CDCP allows for flexibility in cases where a client’s higher or more complex needs are demonstrated and necessitate extra care.
            - paragraph [ref=f8e581]: For example, the CDCP may cover oral hygiene services above frequency limits through preauthorization for patients covered under the CDCP with a physical disability who, as a result of the disability, requires additional support to conduct routine care, such as brushing. Providers must submit preauthorization requests to Sun Life for services above plan frequency limits.
        - generic [ref=f8e583]:
          - heading "How are commercial laboratory costs calculated?" [level=3] [ref=f8e588]
          - generic [ref=f8e592]:
            - paragraph [ref=f8e593]:
              - strong [ref=f8e594]: "Dentists, Dental Specialists, and Independent Dental Hygienists:"
              - text: The CDCP will reimburse reasonable and customary commercial laboratory fees.
            - paragraph [ref=f8e595]:
              - strong [ref=f8e596]: "Denturists:"
              - text: The CDCP will reimburse reasonable and customary commercial laboratory fees. In-house laboratory fee maximums are listed in the
              - link "CDCP Dental Benefit Grids" [ref=f8e597] [cursor=pointer]:
                - /url: /sl/cdcp/en/provider/dental-benefit-grids/
              - text: .
            - paragraph [ref=f8e598]: An estimate or preauthorization must be submitted to confirm if a laboratory fee is eligible for reimbursement.
        - heading "Sun Life Direct" [level=2] [ref=f8e601]
        - generic [ref=f8e603]:
          - heading "What’s Sun Life Direct?" [level=3] [ref=f8e608]
          - generic [ref=f8e612]:
            - paragraph [ref=f8e613]: "Sun Life Direct is Sun Life’s self-serve portal for oral health providers. They can use Sun Life Direct to:"
            - list [ref=f8e614]:
              - listitem [ref=f8e615]:
                - text: Verify their patients’ CDCP coverage eligibility
                - strong
              - listitem [ref=f8e616]: Sign up and manage their banking information for electronic fund transfer payments from Sun Life
              - listitem [ref=f8e617]: View their estimate history
              - listitem [ref=f8e618]: View their payment history
        - generic [ref=f8e620]:
          - heading "What information do oral health providers need to access Sun Life Direct?" [level=3] [ref=f8e625]
          - paragraph [ref=f8e630]: Oral health providers will need an Access ID and password to sign in. They must contact the Sun Life CDCP Contact Centre at 1-888-888-8110 to obtain their Access ID and temporary password.
        - generic [ref=f8e632]:
          - heading "How can oral health providers change their communication preferences?" [level=3] [ref=f8e637]
          - generic [ref=f8e641]:
            - paragraph [ref=f8e642]: If an oral health provider is registered for Sun Life Direct, they’ll receive their communications via email automatically. If not, their communications will be sent via email or mail, depending on their communication preference.
            - paragraph [ref=f8e643]: Oral health providers can change their communication preference by speaking with a Client care representative.
