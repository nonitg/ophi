      - heading "Alerts" [level=1] [ref=f459e40]
      - paragraph [ref=f459e43]: Alerts are time sensitive notifications for members and oral health providers on system maintenance and technical updates. These will be updated as they become available.
      - generic [ref=f459e45]:
        - heading "September 29, 2025" [level=3] [ref=f459e46]
        - paragraph [ref=f459e47]: We expect delivery delays for all CDCP related mail due to the Canada Post service disruption. Sun Life will resume sending mail when the postal service disruption ends.
        - paragraph [ref=f459e48]:
          - text: Oral health providers are encouraged to consult our FAQ on
          - link "How can oral health providers submit CDCP claims and preauthorization during a postal disruption" [ref=f459e49] [cursor=pointer]:
            - /url: /sl/cdcp/en/support/oral-health-provider-faq/#postal-strike
          - text: for additional information.
      - generic [ref=f459e51]:
        - heading "February 28, 2025" [level=3] [ref=f459e52]
        - paragraph [ref=f459e53]: "Oral health providers: We are currently processing a high volume of preauthorization submissions. To help minimize delays, please do not submit the same request multiple times. Thank you for your patience."
      - generic [ref=f459e55]:
        - heading "December 13, 2024" [level=3] [ref=f459e56]
        - paragraph [ref=f459e57]: Members who have not received their CDCP welcome package due to the postal service disruption can call 1-888-888-8110 to obtain their member ID and coverage start date. Parents and legal guardians of members under the age of 18 must contact Service Canada at 1-833-537-4342.
      - generic [ref=f459e59]:
        - heading "December 3, 2024" [level=3] [ref=f459e60]
        - paragraph [ref=f459e61]:
          - text: We are aware of challenges providers are experiencing with preauthorization requests for the Canadian Dental Care Plan (CDCP). Please read our
          - link "Important Update on Preauthorization" [ref=f459e62] [cursor=pointer]:
            - /url: /sl/cdcp/en/support/alerts/important-update-on-preauthorization/
          - text: .
      - generic [ref=f459e64]:
        - heading "November 15, 2024" [level=3] [ref=f459e65]
        - paragraph [ref=f459e66]: We expect delivery delays for all CDCP related mail due to the postal service disruption. Sun Life will resume sending mail when the postal service disruption ends.
        - paragraph [ref=f459e67]:
          - text: Oral health providers are encouraged to consult our FAQ on
          - strong [ref=f459e68]
          - link "How to submit CDCP claims and preauthorization requests during a postal disruption" [ref=f459e69] [cursor=pointer]:
            - /url: /sl/cdcp/en/support/oral-health-provider-faq/#postal-strike
          - text: for additional information.
      - generic [ref=f459e71]:
        - heading "October 31, 2024" [level=3] [ref=f459e72]
        - paragraph [ref=f459e73]: Sun Life is administering the Canadian Dental Care Plan (CDCP) on behalf of the Government of Canada. Oral health providers should continue to submit all CDCP claims to Sun Life.
      - generic [ref=f459e75]:
        - heading "February 8, 2024 - Phishing scams targeting Canadians" [level=3] [ref=f459e76]
        - paragraph [ref=f459e77]: "Sun Life and the Government of Canada are aware of phishing scams targeting Canadians related to the launch of the Canadian Dental Care Plan (CDCP). If you’re concerned about the legitimacy of any CDCP communication, you can contact Service Canada at 1-833-537-4342 (TTY: 1-833-677-6262)."
