<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Colombus{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ STATIC_V }}">
</head>
<body>
<div class="demo-banner">Demo — Fictional Data. No patient information.</div>
<header class="topbar">
  <a class="wordmark" href="/">Colombus</a>
  <nav class="nav">
    <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/cases') %}class="on"{% endif %}>Queue</a>
    <a href="/look-back" {% if request.url.path == '/look-back' %}class="on"{% endif %}>Look-Back</a>
    <a href="/settings" {% if request.url.path.startswith('/settings') %}class="on"{% endif %}>Settings</a>
  </nav>
  <form class="actor" method="post" action="/actor">
    <label for="actor-select">Acting as</label>
    <select id="actor-select" name="actor" data-autosubmit>
      {% for key, a in ACTORS.items() %}
      <option value="{{ key }}" {% if a.key == actor.key %}selected{% endif %}>{{ a.label }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit" class="btn btn-sm">Switch</button></noscript>
  </form>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js?v={{ STATIC_V }}"></script>
</body>
</html>
